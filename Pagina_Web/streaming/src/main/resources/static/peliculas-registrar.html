<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamAdmin — Registrar Película</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<style>
  .form-section { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 32px; max-width: 620px; }
  .bottom-bar { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; gap: 12px; }
</style>
</head>
<body>
<header class="header">
  <div class="logo">Stream<span>Admin</span></div>
  <div class="header-user">
    <span class="user-name" id="headerUser">—</span>
    <button class="btn-logout" onclick="logout()">Salir</button>
  </div>
</header>
<nav class="tabs">
  <a href="peliculas-registrar.html" class="tab active">Registrar Película</a>
  <a href="peliculas-consultar.html" class="tab">Consultar Películas</a>
  <a href="clientes-consultar.html" class="tab">Consultar Clientes</a>
  <a href="usuarios-registro.html" class="tab">Registro de Usuarios</a>
</nav>
<main class="main">
  <div id="alertBox"></div>
  <div class="section-title">Nueva Película</div>
  <div class="form-section">
    <form id="formPelicula">
      <div class="form-grid">
        <label>Nombre</label>
        <input type="text" id="nombre" placeholder="Título de la película" required/>

        <label>Género</label>
        <select id="genero" required>
          <option value="">Cargando géneros...</option>
        </select>

        <label>Link / URL</label>
        <input type="text" id="link" placeholder="https://..."/>

        <label>Imagen</label>
        <div>
          <div class="file-wrap">
            <span class="file-name" id="fileName">Sin archivo seleccionado</span>
            <input type="file" id="imagenFile" accept="image/*" style="display:none"
                   onchange="handleFile(this)"/>
            <button type="button" class="file-btn"
                    onclick="document.getElementById('imagenFile').click()">Examinar</button>
          </div>
          <div id="imgPreview" style="margin-top:10px;display:none;">
            <img id="previewImg" style="height:80px;border-radius:2px;border:1px solid var(--border2);" alt="preview"/>
          </div>
          <input type="text" id="imagenManual" placeholder="o escribe el nombre del archivo"
                 style="margin-top:8px;width:100%;padding:11px 14px;background:var(--input-bg);
                        border:1px solid var(--border2);border-radius:2px;color:var(--text);
                        font-family:'DM Sans',sans-serif;font-size:13px;outline:none;"/>
        </div>

        <label>Descripción</label>
        <textarea id="descripcion" placeholder="Sinopsis..."></textarea>
      </div>
      <div class="bottom-bar">
        <button type="submit" class="btn btn-primary" id="btnGuardar">Registrar Película</button>
        <button type="button" class="btn" style="background:var(--border2);color:var(--text2);"
                onclick="resetForm()">Limpiar</button>
      </div>
    </form>
  </div>
</main>
<script>
const API = 'https://api-streaming-production.up.railway.app';
const usuario = JSON.parse(sessionStorage.getItem('usuario') || 'null');
if (!usuario) window.location.href = 'login.html';
document.getElementById('headerUser').textContent = usuario?.nombre || 'Admin';
function logout() { sessionStorage.clear(); window.location.href = 'login.html'; }

function showAlert(msg, type = 'success') {
  const box = document.getElementById('alertBox');
  box.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => box.innerHTML = '', 4000);
}

async function loadGeneros() {
  try {
    const res = await fetch(`${API}/api/generos`);
    const data = await res.json();
    const sel = document.getElementById('genero');
    sel.innerHTML = '<option value="">— Seleccionar género —</option>';
    data.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g.id;
      opt.textContent = g.nombre;
      sel.appendChild(opt);
    });
  } catch {
    document.getElementById('genero').innerHTML = '<option value="">Error al cargar géneros</option>';
  }
}
loadGeneros();

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('imagenManual').value = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('previewImg').src = e.target.result;
    document.getElementById('imgPreview').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

document.getElementById('formPelicula').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnGuardar');
  btn.textContent = 'Registrando...'; btn.disabled = true;

  const imagen = document.getElementById('imagenManual').value.trim() ||
                 (document.getElementById('imagenFile').files[0]?.name || '');
  const payload = {
    nombre:      document.getElementById('nombre').value.trim(),
    genero:      document.getElementById('genero').value,
    link:        document.getElementById('link').value.trim(),
    imagen,
    descripcion: document.getElementById('descripcion').value.trim()
  };
  try {
    const res = await fetch(`${API}/api/peliculas`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (res.ok) { showAlert(`✓ Película registrada (ID: ${data.id})`); resetForm(); }
    else showAlert(data.error || 'Error al registrar.', 'error');
  } catch { showAlert('Error de conexión.', 'error'); }
  finally { btn.textContent = 'Registrar Película'; btn.disabled = false; }
});

function resetForm() {
  document.getElementById('formPelicula').reset();
  document.getElementById('fileName').textContent = 'Sin archivo seleccionado';
  document.getElementById('imgPreview').style.display = 'none';
}
</script>
</body>
</html>
