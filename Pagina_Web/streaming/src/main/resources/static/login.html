<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamAdmin — Iniciar Sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e;
    --accent: #e50914; --text: #f0f0f0; --muted: #6b6b80; --input-bg: #1a1a26;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .bg-scene {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -20%, rgba(229,9,20,0.18) 0%, transparent 60%),
      linear-gradient(180deg, #0a0a0f 0%, #0d0d18 100%);
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(229,9,20,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(229,9,20,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 100%);
  }
  .card {
    position: relative; z-index: 1; width: 420px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 2px; overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(229,9,20,0.1);
    animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
  .card-top-bar { height: 3px; background: linear-gradient(90deg, var(--accent), #ff6b35); }
  .card-inner { padding: 48px 44px 44px; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 3px; color: var(--text); margin-bottom: 4px; }
  .logo span { color: var(--accent); }
  .subtitle { font-size: 12px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 36px; }
  .avatar-wrap { display: flex; justify-content: center; margin-bottom: 32px; }
  .avatar { width: 72px; height: 72px; background: var(--input-bg); border: 2px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .avatar svg { width: 36px; height: 36px; fill: var(--muted); }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .field input {
    width: 100%; padding: 13px 16px;
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 2px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(229,9,20,0.12); }
  .field input::placeholder { color: #3a3a50; }
  .alert { padding: 12px 14px; border-radius: 2px; font-size: 13px; margin-bottom: 18px; display: none; }
  .alert.error { background: rgba(229,9,20,0.12); border: 1px solid rgba(229,9,20,0.3); color: #ff6b6b; }
  .alert.show { display: block; }
  .btn-login {
    width: 100%; padding: 14px; background: var(--accent); color: #fff;
    border: none; border-radius: 2px;
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 3px;
    cursor: pointer; margin-top: 8px; transition: background 0.2s, transform 0.1s;
  }
  .btn-login:hover { background: #c4070f; }
  .btn-login:active { transform: scale(0.99); }
  .btn-login .spinner { display:none; width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.6s linear infinite; margin:0 auto; }
  .btn-login.loading .btn-text { display: none; }
  .btn-login.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bg-scene"></div>
<div class="bg-grid"></div>
<div class="card">
  <div class="card-top-bar"></div>
  <div class="card-inner">
    <div class="logo">Stream<span>Admin</span></div>
    <div class="subtitle">Panel de Administración</div>
    <div class="avatar-wrap">
      <div class="avatar">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      </div>
    </div>
    <div id="alertBox" class="alert error"></div>
    <form id="loginForm">
      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" id="correo" placeholder="admin@ejemplo.com" required/>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="clave" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">
        <span class="btn-text">INGRESAR</span>
        <div class="spinner"></div>
      </button>
    </form>
  </div>
</div>
<script>
const API = 'https://api-streaming-production.up.railway.app';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const alertBox = document.getElementById('alertBox');
  btn.classList.add('loading');
  alertBox.classList.remove('show');

  try {
    const res = await fetch(`${API}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        correo: document.getElementById('correo').value.trim(),
        clave:  document.getElementById('clave').value
      })
    });
    const data = await res.json();

    if (!res.ok) {
      alertBox.textContent = data.mensaje || 'Credenciales incorrectas.';
      alertBox.classList.add('show');
      btn.classList.remove('loading');
      return;
    }
    if (data.usuario.tipo_usuario !== 'administrador') {
      alertBox.textContent = 'Acceso denegado: solo administradores.';
      alertBox.classList.add('show');
      btn.classList.remove('loading');
      return;
    }

    sessionStorage.setItem('usuario', JSON.stringify(data.usuario));
    window.location.href = 'peliculas-registrar.html';
  } catch {
    alertBox.textContent = 'No se pudo conectar con el servidor.';
    alertBox.classList.add('show');
    btn.classList.remove('loading');
  }
});
</script>
</body>
</html>
